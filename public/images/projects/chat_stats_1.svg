<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b1b"/>
      <stop offset="100%" stop-color="#161515"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="16"/>

  <!-- Phone Mockup Frame -->
  <rect x="260" y="25" width="280" height="450" rx="32" fill="#131313" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Screen Area -->
  <rect x="270" y="40" width="260" height="420" rx="24" fill="#0d0d0d"/>

  <!-- Phone Notch/Island -->
  <rect x="360" y="48" width="80" height="12" rx="6" fill="#1a1a1a"/>

  <!-- App Header -->
  <text x="300" y="85" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Chats Stats</text>
  <rect x="440" y="72" width="75" height="18" rx="9" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
  <text x="477" y="85" fill="#4cd7f6" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">100% LOCAL</text>

  <!-- KPI Cards -->
  <rect x="285" y="105" width="110" height="60" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="297" y="125" fill="#988d9f" font-family="sans-serif" font-size="10">Total Mensajes</text>
  <text x="297" y="152" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">48,290</text>

  <rect x="405" y="105" width="110" height="60" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="417" y="125" fill="#988d9f" font-family="sans-serif" font-size="10">Palabras / Día</text>
  <text x="417" y="152" fill="#4cd7f6" font-family="sans-serif" font-size="18" font-weight="bold">1,420</text>

  <!-- Activity Heatmap Section -->
  <rect x="285" y="180" width="230" height="120" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
  <text x="300" y="202" fill="#e5e2e1" font-family="sans-serif" font-size="11" font-weight="600">Actividad Horaria (Heatmap)</text>

  <!-- Heatmap Matrix Dots -->
  <!-- Row 1 -->
  <rect x="300" y="215" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.2"/>
  <rect x="325" y="215" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.4"/>
  <rect x="350" y="215" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.9"/>
  <rect x="375" y="215" width="20" height="14" rx="3" fill="#06b6d4" fill-opacity="0.8"/>
  <rect x="400" y="215" width="20" height="14" rx="3" fill="#06b6d4" fill-opacity="0.5"/>
  <rect x="425" y="215" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.3"/>
  <rect x="450" y="215" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.1"/>
  <rect x="475" y="215" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.6"/>

  <!-- Row 2 -->
  <rect x="300" y="235" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.3"/>
  <rect x="325" y="235" width="20" height="14" rx="3" fill="#06b6d4" fill-opacity="0.7"/>
  <rect x="350" y="235" width="20" height="14" rx="3" fill="#06b6d4" fill-opacity="1.0" filter="url(#glow)"/>
  <rect x="375" y="235" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.9"/>
  <rect x="400" y="235" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.7"/>
  <rect x="425" y="235" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.4"/>
  <rect x="450" y="235" width="20" height="14" rx="3" fill="#06b6d4" fill-opacity="0.5"/>
  <rect x="475" y="235" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.2"/>

  <!-- Row 3 -->
  <rect x="300" y="255" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.5"/>
  <rect x="325" y="255" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.8"/>
  <rect x="350" y="255" width="20" height="14" rx="3" fill="#06b6d4" fill-opacity="0.6"/>
  <rect x="375" y="255" width="20" height="14" rx="3" fill="#06b6d4" fill-opacity="0.9"/>
  <rect x="400" y="255" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="1.0"/>
  <rect x="425" y="255" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.6"/>
  <rect x="450" y="255" width="20" height="14" rx="3" fill="#a855f7" fill-opacity="0.3"/>
  <rect x="475" y="255" width="20" height="14" rx="3" fill="#06b6d4" fill-opacity="0.4"/>

  <!-- Row labels -->
  <text x="300" y="285" fill="#988d9f" font-family="sans-serif" font-size="9">00h</text>
  <text x="360" y="285" fill="#988d9f" font-family="sans-serif" font-size="9">08h</text>
  <text x="420" y="285" fill="#988d9f" font-family="sans-serif" font-size="9">16h</text>
  <text x="480" y="285" fill="#988d9f" font-family="sans-serif" font-size="9">23h</text>

  <!-- Top Emojis Bar -->
  <rect x="285" y="315" width="230" height="50" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="300" y="335" fill="#988d9f" font-family="sans-serif" font-size="10">Emojis Más Utilizados</text>
  <text x="300" y="355" font-family="sans-serif" font-size="14">😂 1,204   ❤️ 982   🔥 741   🚀 512</text>

  <!-- Bottom Nav -->
  <rect x="285" y="380" width="230" height="45" rx="12" fill="#1c1b1b" stroke="#ffffff" stroke-opacity="0.05"/>
  <circle cx="320" cy="402" r="8" fill="#a855f7"/>
  <circle cx="370" cy="402" r="8" fill="#988d9f" fill-opacity="0.4"/>
  <circle cx="420" cy="402" r="8" fill="#988d9f" fill-opacity="0.4"/>
  <circle cx="470" cy="402" r="8" fill="#988d9f" fill-opacity="0.4"/>
</svg>
