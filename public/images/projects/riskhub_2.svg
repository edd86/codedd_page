<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyberBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>

    <!-- Crimson Cyber Glow -->
    <linearGradient id="crimsonGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E73324"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>

    <!-- Card Hover Border -->
    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E73324"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="glowEffect" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#cyberBg2)"/>
  <rect width="798" height="498" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Header Banner -->
  <g transform="translate(48, 36)">
    <!-- Brand / Section Tag -->
    <rect x="0" y="0" width="160" height="22" rx="11" fill="rgba(231,51,36,0.12)" stroke="rgba(231,51,36,0.4)" stroke-width="1"/>
    <text x="80" y="15" fill="#FF8A80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">
      CATÁLOGO DE SERVICIOS
    </text>

    <text x="0" y="52" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">
      Matriz de Ciberseguridad &amp; Continuidad – RiskHub
    </text>
    <text x="0" y="74" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">
      Servicios consultivos y operativos de alta especialización para instituciones financieras, corporativas y de gobierno.
    </text>
  </g>

  <!-- 4 Core Service Cards Grid (2x2) -->
  <g transform="translate(48, 126)">
    <!-- Card 1: Red Team & Pentesting -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="342" height="136" rx="12" fill="#111827" stroke="rgba(231,51,36,0.4)" stroke-width="1.5"/>
      <!-- Icon badge -->
      <rect x="18" y="18" width="36" height="36" rx="8" fill="rgba(231,51,36,0.2)"/>
      <text x="36" y="42" font-size="18" text-anchor="middle">🎯</text>

      <text x="64" y="34" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
        Red Team &amp; Pentesting OWASP
      </text>
      <text x="64" y="50" fill="#E73324" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600">
        Simulación de Ataques Adversarios
      </text>

      <text x="18" y="78" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" line-height="1.4">
        <tspan x="18" dy="0">Pruebas de intrusión en aplicaciones web, móviles y</tspan>
        <tspan x="18" dy="16">redes siguiendo estándares globales OWASP y CVSS 4.0.</tspan>
      </text>

      <!-- Bottom badge -->
      <rect x="18" y="104" width="110" height="20" rx="5" fill="#1e293b"/>
      <text x="73" y="117" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Metodología Ofensiva</text>
    </g>

    <!-- Card 2: Auditorías ISO 27001 -->
    <g transform="translate(362, 0)">
      <rect x="0" y="0" width="342" height="136" rx="12" fill="#111827" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
      <!-- Icon badge -->
      <rect x="18" y="18" width="36" height="36" rx="8" fill="rgba(56,189,248,0.15)"/>
      <text x="36" y="42" font-size="18" text-anchor="middle">🛡️</text>

      <text x="64" y="34" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
        Auditorías ISO 27001 / SGSI
      </text>
      <text x="64" y="50" fill="#38BDF8" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600">
        Gestión de Seguridad de la Información
      </text>

      <text x="18" y="78" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">
        <tspan x="18" dy="0">Evaluación de controles normativos, auditorías internas,</tspan>
        <tspan x="18" dy="16">análisis de brechas y preparación para certificación.</tspan>
      </text>

      <!-- Bottom badge -->
      <rect x="18" y="104" width="124" height="20" rx="5" fill="#1e293b"/>
      <text x="80" y="117" fill="#A78BFA" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Cumplimiento &amp; SGSI</text>
    </g>

    <!-- Card 3: Continuidad del Negocio ISO 22301 -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="342" height="136" rx="12" fill="#111827" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
      <!-- Icon badge -->
      <rect x="18" y="18" width="36" height="36" rx="8" fill="rgba(34,197,94,0.15)"/>
      <text x="36" y="42" font-size="18" text-anchor="middle">🔄</text>

      <text x="64" y="34" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
        Continuidad del Negocio (BCM/DRP)
      </text>
      <text x="64" y="50" fill="#22C55E" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600">
        Resiliencia Operativa ISO 22301
      </text>

      <text x="18" y="78" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">
        <tspan x="18" dy="0">Análisis BIA, estrategias de continuidad ante desastres y</tspan>
        <tspan x="18" dy="16">pruebas de recuperación de infraestructura tecnológica.</tspan>
      </text>

      <!-- Bottom badge -->
      <rect x="18" y="104" width="118" height="20" rx="5" fill="#1e293b"/>
      <text x="77" y="117" fill="#22C55E" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Planes DRP / BCP</text>
    </g>

    <!-- Card 4: OSINT & Threat Intel -->
    <g transform="translate(362, 150)">
      <rect x="0" y="0" width="342" height="136" rx="12" fill="#111827" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
      <!-- Icon badge -->
      <rect x="18" y="18" width="36" height="36" rx="8" fill="rgba(245,158,11,0.15)"/>
      <text x="36" y="42" font-size="18" text-anchor="middle">🌐</text>

      <text x="64" y="34" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
        OSINT &amp; Inteligencia de Amenazas
      </text>
      <text x="64" y="50" fill="#F59E0B" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600">
        Exposición Digital &amp; Ciberpatrullaje
      </text>

      <text x="18" y="78" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">
        <tspan x="18" dy="0">Identificación proactiva de fuga de credenciales,</tspan>
        <tspan x="18" dy="16">activos expuestos y vectores de ataque en fuentes abiertas.</tspan>
      </text>

      <!-- Bottom badge -->
      <rect x="18" y="104" width="126" height="20" rx="5" fill="#1e293b"/>
      <text x="81" y="117" fill="#F59E0B" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Threat Intelligence</text>
    </g>
  </g>

  <!-- Bottom Process Phase Flow Bar -->
  <g transform="translate(48, 436)">
    <rect x="0" y="0" width="704" height="42" rx="10" fill="#0c1220" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="26" fill="#E2E8F0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">
      Fases:
    </text>
    <text x="80" y="26" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">
      01 Reconocimiento <tspan fill="#E73324">➔</tspan> 02 Explotación <tspan fill="#E73324">➔</tspan> 03 Análisis CVSS 4.0 <tspan fill="#E73324">➔</tspan> 04 Remediación &amp; Re-test
    </text>
  </g>
</svg>
