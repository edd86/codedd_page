<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="qboBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="phoneBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#d4a359"/>
    </linearGradient>
    <linearGradient id="suiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132240"/>
      <stop offset="100%" stop-color="#0b162c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#qboBg2)" rx="16"/>

  <!-- Phone Frame -->
  <rect x="250" y="20" width="300" height="460" rx="34" fill="#0b162c" stroke="url(#phoneBorder2)" stroke-width="2.5"/>
  <rect x="260" y="32" width="280" height="436" rx="26" fill="#091224"/>

  <!-- Notch -->
  <rect x="360" y="42" width="80" height="12" rx="6" fill="#132240"/>

  <!-- Header -->
  <text x="280" y="80" fill="#f4f1ea" font-family="sans-serif" font-size="16" font-weight="bold">Qbo: Suite de Juegos</text>
  <rect x="440" y="67" width="85" height="18" rx="9" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="482" y="80" fill="#34d399" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">69 TESTS PASSED</text>

  <!-- 4 Game Cards Grid -->
  <!-- Card 1: Dudo -->
  <rect x="275" y="100" width="120" height="72" rx="10" fill="url(#suiteGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="288" y="120" fill="#d4a359" font-family="sans-serif" font-size="11" font-weight="bold">Cacho Dudo</text>
  <text x="288" y="136" fill="#988d9f" font-family="sans-serif" font-size="8.5">Faroleo &amp; Dados Ocultos</text>
  <text x="288" y="152" fill="#4cd7f6" font-family="sans-serif" font-size="8.5">5 Cubiletes Virtuales</text>

  <!-- Card 2: Todis -->
  <rect x="405" y="100" width="120" height="72" rx="10" fill="url(#suiteGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="418" y="120" fill="#c84b31" font-family="sans-serif" font-size="11" font-weight="bold">Todis (Fiesta)</text>
  <text x="418" y="136" fill="#988d9f" font-family="sans-serif" font-size="8.5">Dinámica Social 1 Dado</text>
  <text x="418" y="152" fill="#f4f1ea" font-family="sans-serif" font-size="8.5">Toma 1, Reparte 2...</text>

  <!-- Card 3: Mayor o Menor -->
  <rect x="275" y="180" width="120" height="72" rx="10" fill="url(#suiteGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="288" y="200" fill="#4cd7f6" font-family="sans-serif" font-size="11" font-weight="bold">Mayor o Menor</text>
  <text x="288" y="216" fill="#988d9f" font-family="sans-serif" font-size="8.5">2 Dados &amp; Apuestas</text>
  <text x="288" y="232" fill="#34d399" font-family="sans-serif" font-size="8.5">Probabilidades en vivo</text>

  <!-- Card 4: Modo Libre -->
  <rect x="405" y="180" width="120" height="72" rx="10" fill="url(#suiteGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="418" y="200" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="bold">Modo Libre</text>
  <text x="418" y="216" fill="#988d9f" font-family="sans-serif" font-size="8.5">1 a 6 Dados 2D</text>
  <text x="418" y="232" fill="#d4a359" font-family="sans-serif" font-size="8.5">Colores: Azul/Rojo/Verde</text>

  <!-- Architecture Highlights Banner -->
  <rect x="275" y="262" width="250" height="118" rx="12" fill="#132240" fill-opacity="0.6" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>
  <text x="290" y="282" fill="#4cd7f6" font-family="sans-serif" font-size="11" font-weight="bold">Arquitectura Limpia Híbrida</text>

  <rect x="290" y="292" width="220" height="24" rx="6" fill="#0b162c"/>
  <text x="300" y="308" fill="#f4f1ea" font-family="sans-serif" font-size="9">🎮 <tspan font-weight="bold">Flame 2D:</tspan> Física y Sprites (Vista pura)</text>

  <rect x="290" y="322" width="220" height="24" rx="6" fill="#0b162c"/>
  <text x="300" y="338" fill="#f4f1ea" font-family="sans-serif" font-size="9">🧠 <tspan font-weight="bold">Dart Puro &amp; Riverpod:</tspan> Reglas y Notifiers</text>

  <rect x="290" y="352" width="220" height="20" rx="6" fill="#0b162c"/>
  <text x="300" y="366" fill="#d4a359" font-family="sans-serif" font-size="8.5">🔊 Audio Engine con pool circular de baja latencia</text>

  <!-- IAP & Monetization Footer Card -->
  <rect x="275" y="390" width="250" height="58" rx="12" fill="#0b162c" stroke="#d4a359" stroke-width="1"/>
  <text x="290" y="412" fill="#f4f1ea" font-family="sans-serif" font-size="10" font-weight="bold">Monetización Ética &amp; Play Billing</text>
  <text x="290" y="426" fill="#988d9f" font-family="sans-serif" font-size="8.5">AdMob solo cada 10 tiros · IAP "Quitar Anuncios"</text>
  <text x="290" y="438" fill="#34d399" font-family="sans-serif" font-size="8.5 font-weight=600">✓ UMP SDK (RGPD) · 100% Offline Resiliente</text>
</svg>
