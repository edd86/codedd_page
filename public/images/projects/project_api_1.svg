<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#131313"/>
      <stop offset="100%" stop-color="#1c1b1b"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="blurGlow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="16"/>
  <rect width="798" height="498" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="15"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="80" fill="#a855f7" opacity="0.15" filter="url(#blurGlow)"/>
  <circle cx="650" cy="380" r="100" fill="#06b6d4" opacity="0.15" filter="url(#blurGlow)"/>

  <!-- Terminal Window -->
  <rect x="50" y="50" width="700" height="400" rx="12" fill="#131313" stroke="url(#neonGlow)" stroke-width="1.5" opacity="0.95"/>
  <rect x="50" y="50" width="700" height="40" rx="12" fill="#1f1f1f"/>
  <!-- Top window buttons -->
  <circle cx="75" cy="70" r="6" fill="#ff5f56"/>
  <circle cx="95" cy="70" r="6" fill="#ffbd2e"/>
  <circle cx="115" cy="70" r="6" fill="#27c93f"/>
  <text x="400" y="74" fill="#a0a0a0" font-family="monospace" font-size="13" text-anchor="middle">Node.js API Restful — Educational Platform Architecture</text>

  <!-- Code / Architecture diagram -->
  <text x="80" y="130" fill="#a855f7" font-family="monospace" font-size="14" font-weight="bold">POST /api/v1/auth/login <tspan fill="#06b6d4">[200 OK]</tspan></text>
  <rect x="80" y="145" width="300" height="130" rx="8" fill="#1c1b1b" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
  <text x="95" y="170" fill="#cfc2d6" font-family="monospace" font-size="12">{</text>
  <text x="110" y="190" fill="#06b6d4" font-family="monospace" font-size="12">"token": <tspan fill="#a855f7">"eyJhbGciOiJIUzI1Ni..."</tspan>,</text>
  <text x="110" y="210" fill="#06b6d4" font-family="monospace" font-size="12">"user": <tspan fill="#e5e2e1">{ "role": "STUDENT", "id": 86 }</tspan>,</text>
  <text x="110" y="230" fill="#06b6d4" font-family="monospace" font-size="12">"status": <tspan fill="#4cd7f6">"AUTHENTICATED"</tspan></text>
  <text x="95" y="250" fill="#cfc2d6" font-family="monospace" font-size="12">}</text>

  <!-- Flow Chart Cards -->
  <rect x="420" y="145" width="330" height="260" rx="8" fill="#1c1b1b" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
  <text x="440" y="175" fill="#06b6d4" font-family="monospace" font-size="14" font-weight="bold">⚡ Backend Controller Stack</text>

  <rect x="440" y="195" width="290" height="40" rx="6" fill="#2a2a2a" stroke="#a855f7" stroke-width="1"/>
  <text x="585" y="220" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">JWT Authentication &amp; Middleware</text>

  <rect x="440" y="255" width="290" height="40" rx="6" fill="#2a2a2a" stroke="#06b6d4" stroke-width="1"/>
  <text x="585" y="280" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">Educational Service Business Logic</text>

  <rect x="440" y="315" width="290" height="40" rx="6" fill="#2a2a2a" stroke="#ddb7ff" stroke-width="1"/>
  <text x="585" y="340" fill="#ffffff" font-family="sans-serif" font-size="13" text-anchor="middle">Data Repository &amp; Database Layer</text>

  <!-- Status Bar -->
  <text x="80" y="420" fill="#988d9f" font-family="monospace" font-size="12">⚡ Node v26.7.0 | Express | TypeScript | JWT Auth | High Efficiency</text>
</svg>
