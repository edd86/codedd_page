<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="qboBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0b162c"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="phoneBorder1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#132240"/>
      <stop offset="100%" stop-color="#d4a359"/>
    </linearGradient>
    <linearGradient id="amberBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a359"/>
      <stop offset="100%" stop-color="#b88339"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="#0a0a0a" rx="16"/>

  <!-- Phone Mockup Frame -->
  <rect x="250" y="20" width="300" height="460" rx="34" fill="#0b162c" stroke="url(#phoneBorder1)" stroke-width="2.5"/>
  <rect x="260" y="32" width="280" height="436" rx="26" fill="#091224"/>

  <!-- Island / Speaker Notch -->
  <rect x="360" y="42" width="80" height="12" rx="6" fill="#132240"/>

  <!-- App Header -->
  <text x="280" y="80" fill="#f4f1ea" font-family="sans-serif" font-size="16" font-weight="bold">Qbo</text>
  <text x="315" y="80" fill="#d4a359" font-family="sans-serif" font-size="12" font-weight="600">· Cacho Alalay</text>

  <rect x="445" y="67" width="80" height="18" rx="9" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
  <text x="485" y="80" fill="#4cd7f6" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">FLAME 2D</text>

  <!-- Tabletop 2D Dice Tray (Flame Engine) -->
  <rect x="275" y="98" width="250" height="150" rx="14" fill="#132240" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="290" y="118" fill="#988d9f" font-family="sans-serif" font-size="10">Mesa de Lanzamiento (Física 2D)</text>
  
  <!-- Shake Badge -->
  <rect x="430" y="108" width="85" height="16" rx="8" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="0.8"/>
  <text x="472" y="120" fill="#ddb7ff" font-family="sans-serif" font-size="8.5" text-anchor="middle">⚡ Shake-to-Roll</text>

  <!-- 5 Ivory Dice with Dots (Showing Full: 5, 5, 5, 6, 6) -->
  <!-- Die 1: 5 (Settled) -->
  <rect x="290" y="135" width="40" height="40" rx="8" fill="#f4f1ea" filter="url(#shadow1)"/>
  <circle cx="298" cy="143" r="3" fill="#132240"/>
  <circle cx="322" cy="143" r="3" fill="#132240"/>
  <circle cx="310" cy="155" r="3" fill="#c84b31"/>
  <circle cx="298" cy="167" r="3" fill="#132240"/>
  <circle cx="322" cy="167" r="3" fill="#132240"/>

  <!-- Die 2: 5 (Settled) -->
  <rect x="338" y="135" width="40" height="40" rx="8" fill="#f4f1ea" filter="url(#shadow1)"/>
  <circle cx="346" cy="143" r="3" fill="#132240"/>
  <circle cx="370" cy="143" r="3" fill="#132240"/>
  <circle cx="358" cy="155" r="3" fill="#c84b31"/>
  <circle cx="346" cy="167" r="3" fill="#132240"/>
  <circle cx="370" cy="167" r="3" fill="#132240"/>

  <!-- Die 3: 5 (Settled) -->
  <rect x="386" y="135" width="40" height="40" rx="8" fill="#f4f1ea" filter="url(#shadow1)"/>
  <circle cx="394" cy="143" r="3" fill="#132240"/>
  <circle cx="418" cy="143" r="3" fill="#132240"/>
  <circle cx="406" cy="155" r="3" fill="#c84b31"/>
  <circle cx="394" cy="167" r="3" fill="#132240"/>
  <circle cx="418" cy="167" r="3" fill="#132240"/>

  <!-- Die 4: 6 (Settled) -->
  <rect x="434" y="135" width="40" height="40" rx="8" fill="#f4f1ea" filter="url(#shadow1)"/>
  <circle cx="442" cy="143" r="2.8" fill="#132240"/>
  <circle cx="442" cy="155" r="2.8" fill="#132240"/>
  <circle cx="442" cy="167" r="2.8" fill="#132240"/>
  <circle cx="466" cy="143" r="2.8" fill="#132240"/>
  <circle cx="466" cy="155" r="2.8" fill="#132240"/>
  <circle cx="466" cy="167" r="2.8" fill="#132240"/>

  <!-- Die 5: 6 (Settled) -->
  <rect x="480" y="135" width="35" height="40" rx="8" fill="#f4f1ea" filter="url(#shadow1)"/>
  <circle cx="488" cy="143" r="2.8" fill="#132240"/>
  <circle cx="488" cy="155" r="2.8" fill="#132240"/>
  <circle cx="488" cy="167" r="2.8" fill="#132240"/>
  <circle cx="507" cy="143" r="2.8" fill="#132240"/>
  <circle cx="507" cy="155" r="2.8" fill="#132240"/>
  <circle cx="507" cy="167" r="2.8" fill="#132240"/>

  <!-- Detected Hand Result -->
  <rect x="290" y="195" width="220" height="38" rx="8" fill="#0b162c" stroke="#d4a359" stroke-width="1"/>
  <text x="305" y="212" fill="#d4a359" font-family="sans-serif" font-size="10" font-weight="bold">¡JUGADA: FULL DE SENAS Y QUINAS!</text>
  <text x="305" y="226" fill="#f4f1ea" font-family="sans-serif" font-size="9">35 puntos (de mano) · Tiro 1 de 2</text>

  <!-- Cacho Scoreboard Table (Anotaciones) -->
  <rect x="275" y="260" width="250" height="135" rx="12" fill="#132240" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="290" y="280" fill="#f4f1ea" font-family="sans-serif" font-size="11" font-weight="bold">Libreta Oficial Alalay</text>

  <!-- Grid Cells -->
  <rect x="288" y="292" width="70" height="28" rx="6" fill="#0b162c" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="295" y="306" fill="#988d9f" font-family="sans-serif" font-size="8">Escalera</text>
  <text x="295" y="316" fill="#4cd7f6" font-family="sans-serif" font-size="9" font-weight="bold">25 pts</text>

  <rect x="365" y="292" width="70" height="28" rx="6" fill="#0b162c" stroke="#d4a359" stroke-width="1.2"/>
  <text x="372" y="306" fill="#d4a359" font-family="sans-serif" font-size="8">Full</text>
  <text x="372" y="316" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">35 pts</text>

  <rect x="442" y="292" width="70" height="28" rx="6" fill="#0b162c" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="449" y="306" fill="#988d9f" font-family="sans-serif" font-size="8">Póker</text>
  <text x="449" y="316" fill="#988d9f" font-family="sans-serif" font-size="9">- -</text>

  <rect x="288" y="326" width="70" height="28" rx="6" fill="#0b162c" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="295" y="340" fill="#988d9f" font-family="sans-serif" font-size="8">Grande</text>
  <text x="295" y="350" fill="#988d9f" font-family="sans-serif" font-size="9">50 pts</text>

  <rect x="365" y="326" width="70" height="28" rx="6" fill="#0b162c" stroke="#c84b31" stroke-width="1"/>
  <text x="372" y="340" fill="#c84b31" font-family="sans-serif" font-size="8">Dormida</text>
  <text x="372" y="350" fill="#c84b31" font-family="sans-serif" font-size="9" font-weight="bold">Victoria</text>

  <rect x="442" y="326" width="70" height="28" rx="6" fill="#0b162c" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="449" y="340" fill="#988d9f" font-family="sans-serif" font-size="8">Total</text>
  <text x="449" y="350" fill="#4cd7f6" font-family="sans-serif" font-size="9" font-weight="bold">142 pts</text>

  <text x="290" y="380" fill="#988d9f" font-family="sans-serif" font-size="8.5">Jugador en turno: Carlos (Pass &amp; Play)</text>

  <!-- Bottom CTA Roll Button -->
  <rect x="275" y="405" width="250" height="42" rx="14" fill="url(#amberBtn)"/>
  <text x="400" y="431" fill="#0b162c" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LANZAR DADOS (AGITAR O TOCAR)</text>
</svg>
